  const m=new THREE.MeshBasicMaterial({map:t,color,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false});const p=new THREE.Mesh(new THREE.PlaneGeometry(r*2,r*2),m);p.rotation.x=-Math.PI/2;p.position.set(pos[0],1,pos[2]);ar.add(p);return p;}

const CRATE=[-25,92,-150];
function crate(lidOpen=true){const cm=std({color:"#b8862f",roughness:.6});box(56,24,38,cm,CRATE[0],CRATE[1]+12,CRATE[2]);if(lidOpen){const lid=box(56,2,38,cm,CRATE[0],CRATE[1]+38,CRATE[2]-22);lid.rotation.x=-1.25;}
  for(const x of [-18,18])box(4,24.5,39,std({color:"#e8b04a"}),CRATE[0]+x,CRATE[1]+12,CRATE[2]);}
function chalkOutline(opacity=.9){const path=[[-35,-20],[-20,-10],[-15,15],[-25,25],[-23,40],[-10,45],[0,40],[2,25],[15,15],[20,-10],[35,-20],[25,-28],[8,-15],[8,-55],[20,-78],[12,-84],[-2,-62],[-8,-40],[-16,-62],[-28,-80],[-35,-74],[-20,-52],[-20,-15],[-35,-20]];
  line(path.map(p=>[80+p[0],1.2,-180+p[1]]),C.chalk,2.6,{opacity});}
function timeDial(needleSlot,highlight=6,scale=1,progress=1){// brass dial floating above the crate; 12 engine slots
  const c=[CRATE[0],CRATE[1]+60,CRATE[2]];const R=19*scale;const slots=["21:00","21:15","21:30","21:45","22:00","22:15","22:30","22:45","23:00","23:15","23:30","23:45"];
  const pts=[];for(let i=0;i<=72;i++){const a=-Math.PI/2+i/72*Math.PI*2*progress;pts.push([c[0]+Math.cos(a)*R,c[1]-Math.sin(a)*R,c[2]]);}line(pts,C.brass,3.2);
  const pts2=[];for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;pts2.push([c[0]+Math.cos(a)*(R+5),c[1]-Math.sin(a)*(R+5),c[2]]);}line(pts2,C.brass,1.2,{opacity:.5});
  slots.forEach((s,i)=>{const a=Math.PI/2-i/12*Math.PI*2;const hot=i===highlight;const r0=R-(hot?7:4),r1=R+ (hot?3:0);
    line([[c[0]+Math.cos(a)*r0,c[1]+Math.sin(a)*r0,c[2]],[c[0]+Math.cos(a)*r1,c[1]+Math.sin(a)*r1,c[2]]],hot?C.coral:C.brass,hot?5:2.5);
    if(i%2===0||hot)label([s],hot?4.2:2.6,[c[0]+Math.cos(a)*(R+9),c[1]+Math.sin(a)*(R+11),c[2]],{color:hot?C.coral:C.brass,font:"Consolas",size:48,blur:8});});
  const na=Math.PI/2-needleSlot/12*Math.PI*2;line([[c[0],c[1],c[2]+.5],[c[0]+Math.cos(na)*(R-3),c[1]+Math.sin(na)*(R-3),c[2]+.5]],C.ivory,4);
  specks([[c[0],c[1],c[2]+.6]],C.ivory,7);return c;}
function bracket(p,color,s=10,w=3){const [x,y,z]=p;const L=[[[x-s,y-s*.8,z],[x-s,y+s*.8,z],[x-s*.4,y+s*.8,z]],[[x+s*.4,y+s*.8,z],[x+s,y+s*.8,z],[x+s,y-s*.8,z]]];L.forEach(seg=>line(seg,color,w));}
function slip(text,pos,heightCm,burn){// cyan dashed claim slip; burn = 0..1 dissolve with coral embers
  const t=textTex(wrap(text,24),{size:46,font:"Segoe UI",weight:"700",color:C.cyan,glow:C.cyan,blur:6,border:C.cyan,borderDash:[18,12],borderW:5,padX:1.2,padY:1.2,plate:"rgba(63,227,255,0.06)"});
  if(burn){const cv=t.image,g=cv.getContext("2d");g.globalCompositeOperation="destination-out";const W2=cv.width,H2=cv.height;
    for(let i=0;i<2600;i++){const x=rnd()*W2,y=rnd()*H2;const edge=(x/W2)*.6+(1-y/H2)*.4;if(edge<burn+rnd()*.12){g.beginPath();g.arc(x,y,3+rnd()*9,0,7);g.fill();}}
    g.globalCompositeOperation="source-over";t.needsUpdate=true;}
  const s=sprite(t,heightCm*t.userData.w/t.userData.h,heightCm,pos);
  if(burn){const em=[];const w=heightCm*t.userData.w/t.userData.h;for(let i=0;i<70;i++){em.push([pos[0]-w/2+w*(burn*.9+rnd()*.2),pos[1]-heightCm/2+rnd()*heightCm+rnd()*14,pos[2]+rnd()*4]);}specks(em,C.coral,2.4);specks(em.slice(0,25).map(p=>[p[0]+2,p[1]+6,p[2]]),C.yellow,1.6);}
  return s;}
function wrap(t,n){const words=t.split(" "),out=[];let cur="";for(const w of words){if((cur+" "+w).trim().length>n){out.push(cur.trim());cur=w;}else cur+=" "+w;}if(cur.trim())out.push(cur.trim());return out;}
function tag(text,pos,color=C.yellow,h=3.2){return label([text],h,pos,{font:"Consolas",size:44,color,glow:color,blur:6,plate:"rgba(255,214,10,0.07)",border:color,borderW:3,padX:.9,padY:.7});}
function mugAt(p,tilt,beads=true){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(4,3.6,9,20,1,true),std({color:"#e9e2d3",roughness:.5,side:THREE.DoubleSide}));g.add(body);
  const handle=new THREE.Mesh(new THREE.TorusGeometry(2.6,.7,8,16,Math.PI),std({color:"#e9e2d3"}));handle.position.x=4.3;handle.rotation.z=-Math.PI/2;g.add(handle);g.position.set(...p);g.rotation.set(tilt[0],tilt[1],tilt[2]);room.add(g);
  // AR rim on the real-world stand-in: a luminous contour so the frozen mug reads as 'held by the record'
  return g;}
